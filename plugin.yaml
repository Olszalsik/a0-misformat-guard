# misformat_guard plugin manifest.
#
# The framework parses ONLY these keys (helpers/plugins.py PluginMetadata):
# name, title, description, version, settings_sections, per_project_config,
# per_agent_config, always_enabled. There is no model_config, so anything else
# is silently dropped at runtime.
#
# Removed in v0.7.0 as dead:
#   min_framework_version: 2.5.0  -- nothing in the framework (or this plugin)
#                                    reads it, so a version gate that looks
#                                    active is not. The v2.5 requirement is
#                                    documented in AGENTS.md instead.
#   discovery.feature_card         -- not a framework key.
#
# settings_sections drives discoverability: only `agent` and `external` mount
# the plugin settings subsection, so `developer` produced a dead entry and was
# dropped.
name: misformat_guard
title: Misformat Guard
description: >
  Repairs misformatted chat-model responses (bad JSON tool requests) with
  a cheap utility-model call so Agent Zero never stalls or aborts on them.
  Also breaks the "reasoning death-loop" where the agent re-emits the SAME
  failing tool call dozens of times (warns at 2, hard-stops at 4) -- the
  loop none of the framework's own breakers catch. No core patch -- pure
  v2.5 extension hooks. See the README for the full architecture and
  configuration.
version: 0.7.0
settings_sections:
  - agent
per_project_config: true
per_agent_config: true
always_enabled: false
