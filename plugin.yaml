name: misformat_guard
title: Misformat Guard
description: >
  Repairs misformatted chat-model responses (bad JSON tool requests) with
  a cheap utility-model call so Agent Zero never stalls or aborts on them.
  No core patch -- pure v2.5 extension hooks. See the README for the full
  5-layer architecture and configuration.
version: 0.4.1
min_framework_version: 2.5.0
settings_sections:
  - agent
  - developer
per_project_config: true
per_agent_config: true
always_enabled: false
# Discoverable in the Plugins UI as a feature card.
discovery:
  feature_card: true
